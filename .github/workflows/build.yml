name: Build Launcher EXE & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # Déclenche aussi quand tu crées une version (ex: v1.0)
  workflow_dispatch:

# Autorisation obligatoire pour que le bot puisse publier la Release sur la page GitHub
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: 📦 Build EXE with Maven
      # Attention: on met la compilation AVANT de créer le JRE, car "clean" supprime le dossier target
      run: mvn clean package -B

