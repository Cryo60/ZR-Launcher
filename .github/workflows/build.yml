name: Build Launcher EXE & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex: v1.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 👈 IMPORTANT : Permet au bot de push le JSON plus tard

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: 📦 Build EXE with Maven
      run: mvn clean package -B

    - name: 🛠️ Génération du mini-JRE Windows (jlink)
      run: |
        jlink --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec --output target/jre --strip-debug --no-man-pages --no-header-files --compress=2
        
    - name: 🏗️ Création de l'Installeur (Inno Setup)
      run: iscc setup.iss

    - name: 🔍 Check for Release Trigger
      id: release_check
      shell: bash
      run: |
        if [ "${{ github.event.inputs.version }}" != "" ]; then
          echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT
        elif [[ "${{ github.event.head_commit.message }}" =~ \[release\ (v[0-9\.]+)\] ]]; then
          echo "tag=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT
        else
          echo "should_release=false" >> $GITHUB_OUTPUT
        fi

    - name: 🚀 Création automatique de la Release
      if: steps.release_check.outputs.should_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_check.outputs.tag }}
        name: Release ${{ steps.release_check.outputs.tag }}
        # 👇 CORRECTION : On upload l'installeur ET le launcher brut
        files: |
          target/ZRLauncher-Setup.exe
          target/ZRLauncher.exe
        draft: false
        prerelease: false

    - name: 🤖 Mise à jour automatique du launcher_version.json
      if: steps.release_check.outputs.should_release == 'true'
      shell: bash
      run: |
        # Le bot crée ou met à jour le fichier JSON avec le bon lien de téléchargement
        echo '{
          "version": "${{ steps.release_check.outputs.tag }}",
          "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.release_check.outputs.tag }}/ZRLauncher.exe"
        }' > launcher_version.json

        # Le bot s'identifie sur Git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Le bot sauvegarde le fichier sur ton repo
        git add launcher_version.json
        git commit -m "🤖 Auto-update launcher_version.json to ${{ steps.release_check.outputs.tag }}"
        git push
