name: Build Launcher EXE & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: 📦 Build EXE with Maven
      run: mvn clean package -B

    - name: 🛠️ Génération du mini-JRE Windows (jlink)
      run: |
        # jlink crée un JRE sur mesure contenant uniquement ce dont ton app a besoin (Swing, etc.)
        # Cela réduit drastiquement la taille par rapport à un JRE complet.
        jlink --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported --output target/jre --strip-debug --no-man-pages --no-header-files --compress=2
        
    - name: 🏗️ Création de l'Installeur (Inno Setup)
      # iscc est le compilateur d'Inno Setup, pré-installé sur les serveurs Windows de GitHub
      run: iscc setup.iss

    - name: 🚀 Upload Release Asset
      # Cette étape ne s'exécute que si tu crées un Tag (ex: v1.0)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: target/ZRLauncher-Setup.exe
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
