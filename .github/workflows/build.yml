name: Build Launcher EXE & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: 📦 Build EXE with Maven
      run: mvn clean package -B

    - name: 🛠️ Génération du mini-JRE Windows (jlink)
      run: |
        jlink --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported --output target/jre --strip-debug --no-man-pages --no-header-files --compress=2
        
    - name: 🏗️ Création de l'Installeur (Inno Setup)
      run: iscc setup.iss

    # --- NOUVEAU : Sauvegarde l'installeur pour que tu puisses le tester ---
    - name: 💾 Upload Artifact (Pour les tests)
      uses: actions/upload-artifact@v4
      with:
        name: ZRLauncher-Setup
        path: target/ZRLauncher-Setup.exe
        retention-days: 7 # Le fichier restera dispo 7 jours sur GitHub

    # --- INCHANGÉ : Publie la vraie Release pour les joueurs (uniquement si Tag) ---
    - name: 🚀 Upload Release Asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: target/ZRLauncher-Setup.exe
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
